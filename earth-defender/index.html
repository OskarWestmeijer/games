<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Defender</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="fly-view">
        <canvas id="fly-canvas"></canvas>
        <!-- The alert bar: every bomber on its way down, where it is coming down, and
             how long it has left. Across the top of the screen, because it is the thing you are
             actually playing against. fly-view.ts appends a row per ship and hides the whole bar
             when nothing is inbound. -->
        <div id="fly-alerts" hidden>
          <span class="alert-caption">Incoming</span>
        </div>
        <!-- A line from the command post, top and centre, for a few seconds. Its text is
             written by fly-view.ts; the icon is a stand-in of the station itself — a ring, a
             spine and two solar wings — and is deliberately the crudest thing on screen until
             there is real art for it. -->
        <div id="fly-message">
          <svg class="message-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="6.5" />
            <path d="M12 3.5 v17 M3 12 h3.2 M17.8 12 H21" />
            <path d="M1.5 9.5 h3 v5 h-3 z M19.5 9.5 h3 v5 h-3 z" />
          </svg>
          <span class="message-body">
            <span class="message-from">Command post</span>
            <span class="message-text"></span>
          </span>
        </div>
        <!-- Where the nose is pointing, which is not the middle of the screen: the chase camera
             is aimed a little below the nose so the planet stays in frame. Placed every frame
             by fly-view.ts, which also hides it when the nose swings behind the camera. -->
        <div id="fly-reticle" aria-hidden="true"></div>
        <!-- One floating health bar per bomber, positioned over the ship itself every
             frame by fly-view.ts (updateBomberHealthBars()) — not a corner panel, because a
             ship you are aiming at is not something you want to read a bar for somewhere else
             on screen. Empty; how many bars exist is fly/bombers.ts's business. -->
        <div id="fly-bomber-health" aria-hidden="true"></div>
        <!-- The player's own health bar, floating over the aeroplane in the chase view by the
             same means as the bombers' bars (updatePlaneHealthBar() in fly-view.ts). Only
             one of these ever exists, so it is markup rather than something built in JS. -->
        <div id="fly-plane-health" aria-hidden="true"><div id="fly-plane-health-fill"></div></div>
        <!-- The pill is the instruments — what the aircraft is doing. The stick lives in the
             corner legend below, which is why the two are not the same element. -->
        <div id="fly-controls" class="hud">
          <span><span id="fly-speed" class="hud-value">45</span> u/s</span>
          <span><span id="fly-altitude" class="hud-value">120</span> alt</span>
          <span><span id="fly-ammo" class="hud-value">120</span> rds</span>
          <span><span id="fly-rockets" class="hud-value">4</span> rkt</span>
          <span><span id="fly-downed" class="hud-value">0</span> down</span>
          <span><span id="fly-lost" class="hud-value">0</span> lost</span>
          <span class="hud-note coarse-only">Needs a keyboard</span>
        </div>
        <!--
          The bottom right corner, as one column so neither half has to be told the other's
          height: what the keys do, over a flat map of the world with the aircraft on it. Out of
          the way of the readouts in the middle and the map credit on the left.
        -->
        <div id="fly-corner">
          <!-- Keyboard only, so the legend is hidden outright on a touchscreen; the pill says
               "needs a keyboard" there instead. -->
          <div id="fly-keys" class="control-legend">
            <span class="legend-keys"><kbd>↑</kbd><kbd>↓</kbd></span><span>climb &amp; dive</span>
            <span class="legend-keys"><kbd>←</kbd><kbd>→</kbd></span><span>bank &amp; turn</span>
            <span class="legend-keys"><kbd>A</kbd><kbd>D</kbd></span><span>rudder</span>
            <span class="legend-keys"><kbd>W</kbd><kbd>S</kbd></span><span>throttle</span>
            <!-- Its own id, not just text, because fly-view.ts swaps this one word for
                 "restart" once the aircraft is destroyed — the same key does a different job
                 then, and the legend has to say so. -->
            <span class="legend-keys"><kbd>Space</kbd></span><span id="fly-space-label">laser</span>
            <span class="legend-keys"><kbd>R</kbd></span><span>rocket</span>
          </div>
          <!--
            The minimap. The map is static and the marker moves — see `#minimap` in style.css
            for why it is the whole world in one 2:1 panel, and `updateMinimap()` in
            `fly-view.ts` for how the aeroplane gets put on it.
          -->
          <div id="minimap" aria-hidden="true">
            <!-- The bombers' approach paths and marks, drawn by fly-view.ts into this
                 empty layer. Its viewBox is the map itself: 100 across by 50 down, the panel's
                 own 2:1, so a longitude is an x and a latitude is a y. First child, so the
                 lines pass under the two markers below rather than over them. -->
            <svg id="minimap-paths" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
            <svg id="minimap-plane" viewBox="0 0 12 12" width="14" height="14">
              <path d="M6 0.7 L10.5 11.2 L6 8.7 L1.5 11.2 Z" />
            </svg>
            <!-- The Earth defence command post, always up there somewhere. A ring rather than
                 a filled mark, and warm rather than green: it is ours. -->
            <svg id="minimap-post" viewBox="0 0 12 12" width="12" height="12">
              <circle cx="6" cy="6" r="3.4" />
            </svg>
            <!-- The saucer. Hidden by fly-view.ts while there isn't one in the sky. -->
            <svg id="minimap-ufo" viewBox="0 0 12 12" width="12" height="12">
              <circle cx="6" cy="6" r="3.2" />
            </svg>
          </div>
        </div>
        <p class="planet-credit">
          Surface maps from
          <a href="https://visibleearth.nasa.gov/" target="_blank" rel="noopener">NASA Visible Earth</a>
          (public domain), downscaled.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
